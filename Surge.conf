[General]
# 通用设置
# 
# ---延迟设置---
# > 网络访问延迟测速URL
internet-test-url = http://connect.rom.miui.com/generate_204
# > 代理延迟测速URL
proxy-test-url = http://cp.cloudflare.com/generate_204
# > 测试超时（秒）
test-timeout = 5
# 
# ---GeoIP数据库---
# > 自定义GeoIP数据库
geoip-maxmind-url = https://raw.githubusercontent.com/JMVoid/ipip2mmdb/release/Country.mmdb
# 
# ---WiFi助理---
# 在Wi-Fi网络不佳时尝试使用数据网络建立连接
# ture=开启，false=关闭
wifi-assist = false
# 
# ---WiFi访问---
# > 允许WiFi访问
# >> iOS，若允许远程访问将false改为true
allow-wifi-access = false
wifi-access-http-port = 6152
wifi-access-socks5-port = 6153
# >> macOS，若允许远程访问将127.0.0.1改为0.0.0.0
ipv6 = false
ipv6-vif = off
# 
# ---远程控制器---
# > 允许Surge请求查看器或Surge CI进行管理控制
# @前内容为密码
# external-controller-access = 123456@127.0.0.1:6170
# > HTTP API
# 可以让另一个App或者设备通过HTTP API控制Surge功能
# @前内容为密码
# http-api = 123456@127.0.0.1:6166
# > 远程控制器开关
# http-api-tls = true
# http-api-web-dashboard = true
# 
# ---兼容性设置---
# > IPv6 支持（默认关闭）
exclude-simple-hostnames = true
skip-proxy = localhost, *.local,10.0.0.0/8,100.64.0.0/10,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.168.0.0/16,fc00::/7,fe80::/10, *.gclmit.club, *.sto.cn, *.inskylab.com
# > 兼容模式(仅iOS)
# compatibility-mode = 0
# > 排除简单主机名
dns-server = 119.29.29.29, 223.5.5.5, 8.8.8.8, system
# > 跳过代理
read-etc-hosts = true
# 
# ---DNS 服务器---
# 如无必要不建议使用DNS over HTTPS
hijack-dns = 8.8.8.8:53, 8.8.4.4:53
# encrypted-dns-server = quic://223.5.5.5, quic://223.6.6.6, https://1.12.12.12/dns-query, https://120.53.53.53/dns-query
# > 从/etc/hosts读取DNS记录
loglevel = notify
# > 让 Surge 劫持目标为 8.8.8.8 和 8.8.4.4 的 53 端口，解决 Google 系家用产品（如 Chromecast）强制使用 8.8.8.8 和 8.8.4.4、不使用 Surge DNS 的问题。
show-error-page-for-reject = true
# 
# ---高级设置---
# > 日志级别
always-real-ip = *.msftconnecttest.com, *.msftncsi.com, *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com, *.logon.battlenet.com.cn, *.logon.battle.net, stun.l.google.com
# > 当遇到REJECT策略时返回错误页
force-http-engine-hosts = *.ott.cibntv.net
# > Always Real IP Hosts
# 当Surge VIF处理DNS问题时，要求Surge返回真实IP地址
udp-policy-not-supported-behaviour = REJECT
# > TCP Force HTTP Hosts
# 让Surge把TCP连接当作HTTP请求来处理
# Surge HTTP引擎将处理这些请求
# 所有的高级功能，如捕获、重写和脚本等都可以使用
# > UDP转发
# 如果没有代理服务器支持UDP转发
# 可修改为direct或注释本条
# 需注意同一目标主机名TCP请求与UDP请求的源地址不同所造成的隐私及安全风险

